  apiKey: "AIzaSyBxPzZZBpmviWR7wKVIj74889o3-LwgWJs",
  authDomain: "gramatica-turma.firebaseapp.com",
  projectId: "gramatica-turma",
  storageBucket: "gramatica-turma.firebasestorage.app",
  messagingSenderId: "439594653798",
  appId: "1:439594653798:web:033f772a44749d0b8e75a7",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Transforma "João da Silva" em "joao-da-silva" — usado para formar o
// identificador único de cada aluno (nome + turma), sem acentos nem espaços.
function slugifyIdentidade(s) {
  return (s || "")
    .normalize("NFKD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function docIdStorage(key, shared, alunoId) {
  return shared ? "compartilhado__" + key : alunoId + "__" + key;
}

// Substitui o window.storage exclusivo do ambiente de artefato do Claude por
// uma versão equivalente sobre o Firestore — mesma "interface" (get/set com
// chave + flag "shared"), então o resto do app não precisa mudar.
// "shared": um único documento compartilhado por todo mundo (relatórios,
//           banco de perguntas do professor).
// pessoal: um documento por aluno, identificado por nome+turma — assim o
//           progresso segue o aluno mesmo se ele trocar de computador do
//           laboratório, em vez de ficar preso a um navegador específico.
window.storage = {
  _alunoId: null,
  setAlunoId(id) {
    window.storage._alunoId = id;
  },
  getAlunoId() {
    return window.storage._alunoId;
  },
  async get(key, shared) {
    if (!shared && !window.storage._alunoId) throw new Error("aluno ainda não identificado");
    const id = docIdStorage(key, shared, window.storage._alunoId);
    const snap = await db.collection("dados").doc(id).get();
    if (!snap.exists) throw new Error("not found");
    const data = snap.data();
    return { key, value: data.value, shared: !!shared };
  },
  async set(key, value, shared) {
    if (!shared && !window.storage._alunoId) throw new Error("aluno ainda não identificado");
    const id = docIdStorage(key, shared, window.storage._alunoId);
    await db
      .collection("dados")
      .doc(id)
      .set({ value, atualizadoEm: new Date().toISOString() });
    return { key, value, shared: !!shared };
  },
  async delete(key, shared) {
    if (!shared && !window.storage._alunoId) throw new Error("aluno ainda não identificado");
    const id = docIdStorage(key, shared, window.storage._alunoId);
    await db.collection("dados").doc(id).delete();
    return { key, deleted: true, shared: !!shared };
  },
  async list() {
    return { keys: [], shared: false }; // não usado por este app
  },
};

// Se este navegador já tem um aluno identificado (sessão anterior), restaura
// a identidade ANTES do React montar, para o primeiro carregamento já buscar
// o progresso certo no Firestore.
try {
  const cache = localStorage.getItem("aluno-identidade");
  if (cache) {
    const { nome, turma } = JSON.parse(cache);
    if (nome && turma) {
      window.storage.setAlunoId(slugifyIdentidade(nome) + "-" + turma);
    }
  }
} catch (e) {
  /* sem identidade salva ainda — tudo bem, cai na tela de nome/turma */
}
</script>

const TURMAS = ["1AA", "1DB", "1IA", "1IB", "2DB", "2IA", "3IA"];

function serieDaTurma(turma) {
  if (!turma) return null;
  const n = parseInt(turma[0], 10);
  return Number.isNaN(n) ? null : n;
}

const MODULOS_POR_SERIE = {
  1: [1, 2], // 1ª série: Módulo 1 (classes de palavras) + Módulo 2 (oração simples)
  2: [1, 2], // 2ª série: revisão dos Módulos 1 e 2
  3: [1, 2, 3, 4], // 3ª série: todos os módulos (revisão 1 e 2 + coordenadas e subordinadas)
};

function modulosLiberados(turma) {
  const serie = serieDaTurma(turma);
  if (!serie || !MODULOS_POR_SERIE[serie]) return NIVEIS.map((n) => n.id); // sem turma reconhecida: libera tudo
  return MODULOS_POR_SERIE[serie];
}

const TOPICOS_POR_NIVEL = {
  1: TOPICS,
  2: TOPICS_NIVEL2,
  3: TOPICS_NIVEL3,
  4: TOPICS_NIVEL4,
};

const TODOS_TOPICOS = [...TOPICS, ...TOPICS_NIVEL2, ...TOPICS_NIVEL3, ...TOPICS_NIVEL4];

const TOPICO_ID_PARA_NIVEL = {};
Object.entries(TOPICOS_POR_NIVEL).forEach(([nivelId, topicos]) => {
  topicos.forEach((t) => {
    TOPICO_ID_PARA_NIVEL[t.id] = Number(nivelId);
  });
});

function topicosParaTurma(turma) {
  const idsPermitidos = modulosLiberados(turma);
  return TODOS_TOPICOS.filter((t) => idsPermitidos.includes(TOPICO_ID_PARA_NIVEL[t.id]));
}

// Marcos de progresso escalados ao total de tópicos que a turma realmente
// consegue acessar (2 módulos, não os 4) — senão "Trilha Completa" nunca
// desbloqueia para ninguém.
function contagemAchievementsParaTurma(totalTopicos) {
  const marcos = [
    { n: 1, nome: "Primeiros Passos", icone: "🥾" },
    { n: 3, nome: "Em Ritmo", icone: "🚶" },
    { n: Math.max(4, Math.round(totalTopicos * 0.25)), nome: "Ganhando Ritmo", icone: "🧩" },
    { n: Math.max(5, Math.round(totalTopicos * 0.5)), nome: "Metade da Trilha", icone: "🏔️" },
    { n: Math.max(6, Math.round(totalTopicos * 0.75)), nome: "Quase Lá", icone: "📚" },
    { n: totalTopicos, nome: "Trilha Completa", icone: "🎓" },
  ];
  const vistos = new Set();
  return marcos
    .filter((m) => m.n <= totalTopicos && !vistos.has(m.n) && vistos.add(m.n))
    .map((c) => ({
      id: `contagem-${c.n}`,
      nome: c.nome,
      icone: c.icone,
      cor: "#813017",
      condicao: (p) => p.concluidos.length >= c.n,
    }));
}

// Monta a lista de conquistas visíveis/possíveis para a turma do aluno: só
// entram tópicos e módulos que a turma realmente acessa, então nenhum selo
// fica permanentemente impossível de conquistar.
const achievementsCacheParaTurma = {};

function achievementsParaTurma(turma) {
  const chave = turma || "__todas__";
  if (achievementsCacheParaTurma[chave]) return achievementsCacheParaTurma[chave];

  const idsPermitidos = modulosLiberados(turma);
  const topicosOk = topicosParaTurma(turma);

  const nivelAchievements = [];
  if (idsPermitidos.includes(1)) nivelAchievements.push(genioAchievement);
  if (idsPermitidos.includes(2)) nivelAchievements.push(sintaticistaAchievement);
  if (idsPermitidos.includes(3)) nivelAchievements.push(coordenadorAchievement);
  if (idsPermitidos.includes(4)) nivelAchievements.push(subordinadorAchievement);

  const base = [
    ...topicAchievementsParaTurma(topicosOk),
    ...xpAchievements,
    ...contagemAchievementsParaTurma(topicosOk.length),
    ...nivelAchievements,
    ...tiposAchievements,
    ...comboAchievements,
    ...exerciciosAchievements,
    naoDesistiu,
    exploradorParaTurma(topicosOk),
  ];

  const colecionadorSupremo = {
    id: "colecionador-supremo",
    nome: "Colecionador Supremo",
    icone: "👑",
    cor: "#FF2B6F",
    condicao: (p) => base.every((a) => a.condicao(p)),
  };

  const lista = [...base, colecionadorSupremo];
  achievementsCacheParaTurma[chave] = lista;
  return lista;
}

function useProgress() {
  const [progress, setProgress] = useState(null);
  const [loaded, setLoaded] = useState(false);

  // Busca o progresso do aluno atualmente identificado (window.storage._alunoId).
  // Se não existir ainda no Firestore (aluno novo), devolve um estado em
  // branco já com nome/turma preenchidos, em vez de lançar erro.
  const carregarDoAlunoAtual = useCallback(async (nomeFallback, turmaFallback) => {
    try {
      const res = await window.storage.get("progresso-gramatica");
      const parsed = res ? JSON.parse(res.value) : null;
      return parsed
        ? { ...estadoInicialProgress(), ...parsed }
        : { ...estadoInicialProgress(), nome: nomeFallback || "", turma: turmaFallback || "" };
    } catch {
      return { ...estadoInicialProgress(), nome: nomeFallback || "", turma: turmaFallback || "" };
    }
  }, []);

  useEffect(() => {
    (async () => {
      const p = await carregarDoAlunoAtual();
      setProgress(p);
      setLoaded(true);
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const save = useCallback(async (next) => {
    setProgress(next);
    try {
      await window.storage.set("progresso-gramatica", JSON.stringify(next));
    } catch {
      /* silencioso: progresso local ainda funciona nesta sessão */
    }
  }, []);

  // Chamado quando nome+turma ficam conhecidos (tela inicial, ou de novo após
  // "trocar de aluno"). Busca primeiro o progresso JÁ SALVO dessa identidade
  // no Firestore — sem isso, reentrar com o mesmo nome sobrescreveria o
  // histórico existente com um estado em branco.
  const identificarAluno = useCallback(
    async (nome, turma) => {
      const alunoId = slugifyIdentidade(nome) + "-" + turma;
      window.storage.setAlunoId(alunoId);
      try {
        localStorage.setItem("aluno-identidade", JSON.stringify({ nome, turma }));
      } catch {
        /* sem localStorage disponível — identidade só dura esta sessão */
      }
      const existente = await carregarDoAlunoAtual(nome, turma);
      setProgress(existente);
      try {
        await window.storage.set("progresso-gramatica", JSON.stringify(existente));
      } catch {
        /* silencioso: fica local nesta sessão, tenta de novo no próximo save */
      }
    },
    [carregarDoAlunoAtual]
  );

  // Limpa a identidade salva NESTE computador — não apaga o progresso do
  // aluno no Firestore, só "desconecta" este aparelho dele, para o próximo
  // aluno a usar o mesmo PC começar do zero (tela de nome/turma) em vez de
  // herdar a sessão anterior.
  const trocarAluno = useCallback(() => {
    try {
      localStorage.removeItem("aluno-identidade");
    } catch {
      /* nada a limpar */
    }
    window.storage.setAlunoId(null);
    setProgress(estadoInicialProgress());
  }, []);

  return { progress, save, loaded, trocarAluno, identificarAluno };
}

// A senha real não fica em texto puro no código — fica só o "hash" dela.
// Para trocar a senha: abra o console do navegador (F12) nesta página e rode
//   await sha256("sua-nova-senha")
// e cole o resultado abaixo, substituindo o valor de PROFESSOR_PIN_HASH.

const PROFESSOR_PIN_HASH = "2dcef18c1690834c7bdd0d0fb8eecc8c04ec573728c54863c649f09e513831ec";

async function sha256(texto) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texto));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}
if (typeof window !== "undefined") window.sha256 = sha256; // disponível no console para trocar a senha

function useCustomQuestions() {

function embaralhar(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function McqExercise({ ex, onAnswer, locked, feedback }) {
  const opcoes = useMemo(() => embaralhar(ex.options), [ex]);
  return (
    <div>
      <p className="ex-prompt">{ex.prompt}</p>
      <div className="mcq-grid">
        {opcoes.map((opt) => {
          const isCorrect = opt === ex.correct;
          const isPicked = feedback?.picked === opt;
          let cls = "mcq-opt";
          if (feedback && isPicked) cls += isCorrect ? " opt-correct" : " opt-wrong";
          else if (feedback && isCorrect) cls += " opt-correct";
          return (
            <button
              key={opt}
              disabled={locked}
              className={cls}
              onClick={() => onAnswer(opt === ex.correct, opt)}
            >
              {opt}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ClassifyExercise({ ex, onAnswer, locked, feedback }) {
  const acceptable = Array.isArray(ex.correct) ? ex.correct : [ex.correct];
  const isAccepted = (w) => acceptable.includes(w);
  return (
    <div>
      <p className="ex-prompt">{ex.prompt}</p>
      <div className="sentence-box">
        {ex.words.map((w, i) => {
          const isCorrect = isAccepted(w);
          const isPicked = feedback?.picked === w && feedback?.pickedIdx === i;
          let cls = "word-chip";
          if (feedback && isPicked) cls += isCorrect ? " chip-correct" : " chip-wrong";
          else if (feedback && isCorrect && feedback.picked) cls += " chip-correct";
          return (
            <button
              key={i}
              disabled={locked}
              className={cls}
              onClick={() => onAnswer(isCorrect, w, i)}
            >
              {w}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function DragdropExercise({ ex, onAnswer, locked }) {
  const [placed, setPlaced] = useState({});
  const [selected, setSelected] = useState(null); // toque-para-selecionar (fallback)
  const [checked, setChecked] = useState(false);
  const [drag, setDrag] = useState(null); // { word, x, y, offsetX, offsetY, w, h, startX, startY, overBucket }
  const bucketRefs = React.useRef({});
  const dragRef = React.useRef(null);

  useEffect(() => {
    dragRef.current = drag;
  }, [drag]);

  const remaining = ex.items.filter((it) => !(it.word in placed));

  function placeItem(word, bucket) {
    if (locked || checked) return;
    setPlaced((p) => ({ ...p, [word]: bucket }));
    setSelected(null);
  }

  function hitTestBucket(clientX, clientY) {
    for (const b of ex.buckets) {
      const el = bucketRefs.current[b];
      if (!el) continue;
      const r = el.getBoundingClientRect();
      if (clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom) {
        return b;
      }
    }
    return null;
  }

  function onPointerDown(e, word) {
    if (locked || checked) return;
    // Evita que o navegador (principalmente em desktop, com mouse) inicie uma
    // seleção de texto ou um drag nativo por baixo do nosso drag customizado.
    e.preventDefault();
    const rect = e.currentTarget.getBoundingClientRect();
    setDrag({
      word,
      x: e.clientX,
      y: e.clientY,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
      w: rect.width,
      h: rect.height,
      startX: e.clientX,
      startY: e.clientY,
      overBucket: null,
    });
  }

  // Escuta o movimento/soltura na janela inteira, não só no elemento onde o
  // arraste começou. Depender só de setPointerCapture no próprio chip é a causa
  // mais comum de drag-and-drop "travando" em desktop: se o cursor sai rápido
  // do elemento, alguns navegadores perdem a captura antes do pointerup.
  useEffect(() => {
    if (!drag) return;

    function onMove(e) {
      const overBucket = hitTestBucket(e.clientX, e.clientY);
      setDrag((d) => d && { ...d, x: e.clientX, y: e.clientY, overBucket });
    }

    function finalizar(e) {
      const d = dragRef.current;
      if (!d) return;
      const moved = Math.hypot(e.clientX - d.startX, e.clientY - d.startY);
      if (moved < 6) {
        setSelected((prev) => (d.word === prev ? null : d.word));
      } else {
        const bucket = hitTestBucket(e.clientX, e.clientY);
        if (bucket) placeItem(d.word, bucket);
      }
      setDrag(null);
    }

    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", finalizar);
    window.addEventListener("pointercancel", () => setDrag(null));
    return () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", finalizar);
      window.removeEventListener("pointercancel", () => setDrag(null));
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [Boolean(drag)]);

  function check() {
    const allCorrect = ex.items.every((it) => placed[it.word] === it.bucket);
    setChecked(true);
    onAnswer(allCorrect, placed);
  }

  return (
    <div>
      <p className="ex-prompt">{ex.prompt}</p>
      <p className="drag-instructions">
        Arraste a palavra até o grupo certo — ou toque na palavra e depois no grupo.
      </p>
      <div className="drag-pool">
        {remaining.map((it) => (
          <div
            key={it.word}
            className={
              "drag-chip" +
              (selected === it.word ? " chip-selected" : "") +
              (drag?.word === it.word ? " chip-dragging-source" : "")
            }
            style={{ touchAction: "none" }}
            onPointerDown={(e) => onPointerDown(e, it.word)}
          >
            {it.word}
          </div>
        ))}
        {remaining.length === 0 && !checked && (
          <span className="drag-hint">Todas as palavras foram classificadas — confira abaixo.</span>
        )}
      </div>
      <div className="bucket-row">
        {ex.buckets.map((b) => {
          const words = Object.entries(placed).filter(([, bk]) => bk === b);
          return (
            <div
              key={b}
              ref={(el) => (bucketRefs.current[b] = el)}
              className={
                "bucket" +
                (drag?.overBucket === b ? " bucket-hover" : "") +
                (selected ? " bucket-selectable" : "")
              }
              onClick={() => selected && placeItem(selected, b)}
            >
              <div className="bucket-label">{b}</div>
              <div className="bucket-items">
                {words.map(([w]) => {
                  const correct = ex.items.find((it) => it.word === w)?.bucket === b;
                  return (
                    <span
                      key={w}
                      className={
                        "drag-chip placed" +
                        (checked ? (correct ? " chip-correct" : " chip-wrong") : "")
                      }
                    >
                      {w}
                    </span>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
      {!checked && (
        <button className="btn-check" disabled={remaining.length > 0} onClick={check}>
          Conferir
        </button>
      )}
      {drag && (
        <div
          className="drag-ghost"
          style={{
            left: drag.x - drag.offsetX,
            top: drag.y - drag.offsetY,
            width: drag.w,
          }}
        >
          {drag.word}
        </div>
      )}
    </div>
  );
}

   ========================================================================= */

function LicaoScreen({ topic, onFinish, onExit, onEachAnswer, onFail }) {
  const [idx, setIdx] = useState(0);
  const [hearts, setHearts] = useState(START_HEARTS);
  const [feedback, setFeedback] = useState(null);
  const [acertos, setAcertos] = useState(0);
  const [failed, setFailed] = useState(false);

  // Sorteia a ordem (e, se houver muitas perguntas — base + as do professor —,
  // sorteia também quais entram) uma única vez, quando a lição começa. Assim
  // cada tentativa do tópico fica diferente, mas não reembaralha a cada clique.
  const [pool] = useState(() => {
    const embaralhado = embaralhar(topic.exercicios);
    return embaralhado.slice(0, Math.min(embaralhado.length, TAMANHO_LICAO));
  });

  const ex = pool[idx];

  function handleAnswer(correct, picked, pickedIdx) {
    if (feedback) return;
    setFeedback({ correct, picked, pickedIdx });
    onEachAnswer(ex.type, correct);
    if (correct) {
      setAcertos((a) => a + 1);
    } else {
      setHearts((h) => {
        const nh = h - 1;
        if (nh <= 0) {
          onFail();
          setTimeout(() => setFailed(true), 900);
        }
        return nh;
      });
    }
  }

  function next() {
    if (hearts <= 0) return;
    setFeedback(null);
    if (idx + 1 >= pool.length) {
      onFinish(acertos, pool.length);
    } else {
      setIdx(idx + 1);
    }
  }

  if (failed) {
    return (
      <div className="screen center-screen">
        <div className="fail-card">
          <div className="fail-emoji">✕</div>
          <h2>Sem corações!</h2>
          <p>Revise a dica do tópico e tente de novo.</p>
          <div className="dica-box">{topic.dica}</div>
          <button className="btn-primary" onClick={onExit}>
            Voltar à trilha
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="screen">
      <div className="lesson-header">
        <button className="btn-x" onClick={onExit} aria-label="Sair da lição">
          ×
        </button>
        <div className="progress-track">
          <div
            className="progress-fill"
            style={{
              width: `${(idx / pool.length) * 100}%`,
              background: topic.cor,
            }}
          />
        </div>
        <div className="hearts">
          {Array.from({ length: START_HEARTS }).map((_, i) => (
            <span key={i} className={i < hearts ? "heart" : "heart heart-lost"}>
              ♥
            </span>
          ))}
        </div>
      </div>

      <div className="lesson-body">
        <div className="topic-tag" style={{ background: topic.cor }}>
          {topic.nome}
        </div>

        {ex.type === "mcq" && (
          <McqExercise key={idx} ex={ex} onAnswer={handleAnswer} locked={!!feedback} feedback={feedback} />
        )}
        {ex.type === "classify" && (
          <ClassifyExercise key={idx} ex={ex} onAnswer={handleAnswer} locked={!!feedback} feedback={feedback} />
        )}
        {ex.type === "fillblank" && (
          <FillblankExercise key={idx} ex={ex} onAnswer={handleAnswer} locked={!!feedback} feedback={feedback} />
        )}
        {ex.type === "dragdrop" && (
          <DragdropExercise key={idx} ex={ex} onAnswer={handleAnswer} locked={!!feedback} />
        )}
      </div>

      {feedback && (
        <div className={"feedback-bar " + (feedback.correct ? "fb-correct" : "fb-wrong")}>
          <div className="fb-text">
            {feedback.correct ? "Correto!" : `Quase. Resposta certa marcada acima.`}
          </div>
          <button className="btn-primary" onClick={next}>
            Continuar
          </button>
        </div>
      )}
    </div>
  );
}

          </p>
          {progress.nome && (
            <button className="link-trocar-aluno" onClick={confirmarTrocarAluno}>
              não é você? trocar de aluno
            </button>
          )}
        </div>
        <div className="header-actions">
          <div className="stat-pill">
            <span className="stat-num">{progress.xp}</span>
            <span className="stat-label">XP</span>
          </div>
          <button className="btn-professor" onClick={onOpenProfessor} title="Área do professor">
            🔑
          </button>
        </div>
      </header>

      <div className="acoes-secundarias">
        <button className="chip-acao" onClick={onOpenColecao}>
          🏆 Minha coleção <span className="chip-acao-num">{conquistas}/{achievements.length}</span>
        </button>
        <button className="chip-acao" onClick={onOpenRelatorio}>
          📄 Gerar relatório
        </button>
      </div>

      {niveisVisiveis.map((nivel, idxNivel) => {
        const topicosDoNivel = TOPICOS_POR_NIVEL[nivel.id] || [];
        const nivelAnteriorVisivel = idxNivel > 0 ? niveisVisiveis[idxNivel - 1] : null;
        const topicosNivelAnterior = nivelAnteriorVisivel
          ? TOPICOS_POR_NIVEL[nivelAnteriorVisivel.id]
          : null;
        const nivelAnteriorCompleto =
          !topicosNivelAnterior || topicosNivelAnterior.every((t) => progress.concluidos.includes(t.id));

        return (
          <section key={nivel.id} className="nivel-section">
            <div className="nivel-title-row">
              <span className="nivel-index">Módulo {nivel.id}</span>
              <h2>{nivel.titulo}</h2>
            </div>

            <div className="node-path">
              {topicosDoNivel.map((t, i) => {
                const prevDone =
                  i === 0 ? nivelAnteriorCompleto : progress.concluidos.includes(topicosDoNivel[i - 1].id);
                const done = progress.concluidos.includes(t.id);
                const locked = !prevDone && !done;
                return (
                  <div className="node-row" key={t.id}>
                    <button
                      className={
                        "node" +
                        (done ? " node-done" : "") +
                        (locked ? " node-locked" : "")
                      }
                      style={{ background: locked ? undefined : t.cor }}
                      disabled={locked}
                      onClick={() => onOpenTopic(t)}
                    >
                      {done ? "✓" : locked ? "🔒" : i + 1}
                    </button>
                    <span className="node-name">{t.nome}</span>
                  </div>
                );
              })}
            </div>
          </section>
        );
      })}
    </div>
  );
}

/* =========================================================================
   RELATÓRIO DE PROGRESSO
   ========================================================================= */

function RelatorioScreen({ progress, onExit }) {
  const [copiado, setCopiado] = useState(false);
  const [enviado, setEnviado] = useState(false);
  const [enviando, setEnviando] = useState(false);
  const [erroEnvio, setErroEnvio] = useState("");

  const topicosDaTurma = topicosParaTurma(progress.turma);
  const desempenho = topicosDaTurma.map((t) => {
    const s = progress.estatisticasPorTopico[t.id];
    const acertos = s ? s.acertos : 0;
    const erros = s ? s.erros : 0;
    const totalResp = acertos + erros;
    const pct = totalResp > 0 ? Math.round((acertos / totalResp) * 100) : null;

    // Primeira tentativa: guardada uma única vez, não se dilui se o aluno
    // refizer a lição depois. É essa que revela a dificuldade real.
    // Dados antigos (de antes dessa mudança) não têm esse campo — nesse caso
    // caímos de volta no acumulado, em vez de esconder o tópico do relatório.
    const temPrimeira =
      s && s.primeiraTentativaAcertos !== null && s.primeiraTentativaAcertos !== undefined;
    const acertosPrimeira = temPrimeira ? s.primeiraTentativaAcertos : acertos;
    const errosPrimeira = temPrimeira ? s.primeiraTentativaErros : erros;
    const totalPrimeira = acertosPrimeira + errosPrimeira;
    const pctPrimeira = totalPrimeira > 0 ? Math.round((acertosPrimeira / totalPrimeira) * 100) : null;
    const dominouDepois = !!(s && s.completoSemErro) && errosPrimeira > 0;

    return {
      nome: t.nome,
      pct,
      acertos,
      erros,
      pctPrimeira,
      acertosPrimeira,
      errosPrimeira,
      dominouDepois,
      feito: progress.concluidos.includes(t.id),
    };
  });
  const totalAcertos = desempenho.reduce((soma, d) => soma + d.acertos, 0);
  const totalErros = desempenho.reduce((soma, d) => soma + d.erros, 0);
  const facilidades = desempenho
    .filter((d) => d.pctPrimeira !== null && d.pctPrimeira >= 90)
    .map((d) => `${d.nome} (${d.acertosPrimeira} acertos, ${d.errosPrimeira} erros na 1ª tentativa)`);
  const dificuldades = desempenho
    .filter((d) => d.pctPrimeira !== null && d.pctPrimeira < 70)
    .map(
      (d) =>
        `${d.nome} (${d.acertosPrimeira} acertos, ${d.errosPrimeira} erros na 1ª tentativa${
          d.dominouDepois ? " — já dominou depois" : ""
        })`
    );
  const conquistas = achievementsParaTurma(progress.turma).filter((a) => a.condicao(progress)).length;

  const texto = [
    `Relatório de progresso — ${progress.nome || "Aluno(a)"}${progress.turma ? ` (${progress.turma})` : ""}`,
    `Tópicos concluídos: ${progress.concluidos.length} de ${topicosDaTurma.length}`,
    `XP total: ${progress.xp}`,
    `Exercícios respondidos: ${progress.totalExerciciosRespondidos} (${totalAcertos} acertos, ${totalErros} erros no acumulado)`,
    `Conquistas desbloqueadas: ${conquistas} de ${achievementsParaTurma(progress.turma).length}`,
    "",
    facilidades.length
      ? `Facilidades (1ª tentativa): ${facilidades.join(", ")}`
      : "Facilidades (1ª tentativa): ainda sem dados suficientes",
    dificuldades.length
      ? `Dificuldades (1ª tentativa): ${dificuldades.join(", ")}`
      : "Dificuldades (1ª tentativa): nenhuma dificuldade identificada até agora",
  ].join("\n");

  async function copiar() {
    try {
      await navigator.clipboard.writeText(texto);
      setCopiado(true);
      setTimeout(() => setCopiado(false), 2000);
    } catch {
      /* clipboard indisponível nesta janela — o texto ainda pode ser selecionado manualmente */
    }
  }

  async function enviar() {
    setEnviando(true);
    setErroEnvio("");
    setEnviado(false);
    try {
      if (!window.storage) {
        throw new Error("Armazenamento indisponível neste ambiente.");
      }
      let lista = [];
      try {
        const atual = await window.storage.get("relatorios-alunos", true);
        lista = atual && atual.value ? JSON.parse(atual.value) : [];
        if (!Array.isArray(lista)) lista = [];
      } catch {
        lista = []; // ainda não existe nenhum relatório salvo — começamos a lista agora
      }
      lista.push({
        nome: progress.nome || "Aluno(a) sem nome",
        turma: progress.turma || "",
        data: new Date().toISOString(),
        texto,
      });
      const resultado = await window.storage.set("relatorios-alunos", JSON.stringify(lista), true);
      if (!resultado) {
        throw new Error("A gravação não foi confirmada.");
      }
      setEnviado(true);
    } catch (e) {
      setErroEnvio(
        "Não foi possível enviar agora (" +
          (e && e.message ? e.message : "erro desconhecido") +
          "). Copie o relatório e envie por outro meio, ou tente novamente."
      );
    }
    setEnviando(false);
  }

  return (
    <div className="screen">
      <div className="lesson-header">
        <button className="btn-x" onClick={onExit} aria-label="Voltar">
          ×
        </button>
        <h2 className="professor-title">Relatório de progresso</h2>
      </div>
      <div className="lesson-body">
        <pre className="relatorio-texto">{texto}</pre>
        <button className="btn-primary" onClick={copiar}>
          {copiado ? "Copiado!" : "Copiar relatório"}
        </button>
        <button className="btn-secundario" onClick={enviar} disabled={enviando}>
          {enviando ? "Enviando…" : enviado ? "Enviado ao professor ✓" : "Enviar ao professor"}
        </button>
        {erroEnvio && <p className="pin-erro">{erroEnvio}</p>}
      </div>
    </div>
  );
}

/* =========================================================================
   ÁREA DO PROFESSOR
   ========================================================================= */

function ProfessorLogin({ onSuccess, onExit }) {
  const [pin, setPin] = useState("");
  const [erro, setErro] = useState(false);
  const [verificando, setVerificando] = useState(false);
  const [tentativas, setTentativas] = useState(0);
  const [bloqueadoAte, setBloqueadoAte] = useState(0);
  const [agora, setAgora] = useState(Date.now());

  useEffect(() => {
    if (!bloqueadoAte) return;
    const t = setInterval(() => setAgora(Date.now()), 500);
    return () => clearInterval(t);
  }, [bloqueadoAte]);

  const bloqueado = bloqueadoAte > agora;
  const segundosRestantes = bloqueado ? Math.ceil((bloqueadoAte - agora) / 1000) : 0;

  async function tentar() {
    if (bloqueado || verificando || !pin) return;
    setVerificando(true);
    const hash = await sha256(pin);
    setVerificando(false);
    if (hash === PROFESSOR_PIN_HASH) {
      onSuccess();
      return;
    }
    const novasTentativas = tentativas + 1;
    setTentativas(novasTentativas);
    setErro(true);
    setPin("");
    if (novasTentativas >= LOGIN_MAX_TENTATIVAS) {
      setBloqueadoAte(Date.now() + LOGIN_BLOQUEIO_MS);
      setTentativas(0);
    }
  }

  return (
    <div className="screen center-screen">
      <div className="fail-card">
        <h2>Área do professor</h2>
        <p className="result-sub">Digite a senha de acesso para adicionar perguntas.</p>
        <input
          className="pin-input"
          type="password"
          value={pin}
          disabled={bloqueado || verificando}
          onChange={(e) => {
            setPin(e.target.value);
            setErro(false);
          }}
          onKeyDown={(e) => e.key === "Enter" && tentar()}
          placeholder="Senha"
        />
        {erro && !bloqueado && <p className="pin-erro">Senha incorreta.</p>}
        {bloqueado && (
          <p className="pin-erro">
            Muitas tentativas. Tente de novo em {segundosRestantes}s.
          </p>
        )}
        <button className="btn-primary" onClick={tentar} disabled={bloqueado || verificando}>
          {verificando ? "Verificando..." : "Entrar"}
        </button>
        <button className="btn-secundario" onClick={onExit}>
          Voltar
        </button>
      </div>
    </div>
  );
}

const TIPO_LABELS = {
  mcq: "Múltipla escolha",
  classify: "Classificar na frase",
  fillblank: "Completar frase",
  dragdrop: "Arrastar e soltar",
};

function ProfessorPanel({ custom, onSave, onExit }) {
  const [aba, setAba] = useState("perguntas");
  const [relatorios, setRelatorios] = useState([]);
  const [carregandoRelatorios, setCarregandoRelatorios] = useState(false);
  const [erroRelatorios, setErroRelatorios] = useState("");
  const [filtroTurma, setFiltroTurma] = useState("todas");

  const buscarRelatorios = useCallback(async () => {
    setCarregandoRelatorios(true);
    setErroRelatorios("");
    try {
      const res = await window.storage.get("relatorios-alunos", true);
      const lista = res && res.value ? JSON.parse(res.value) : [];
      setRelatorios(Array.isArray(lista) ? lista : []);
    } catch {
      setRelatorios([]); // ainda não há nenhum relatório enviado
    }
    setCarregandoRelatorios(false);
  }, []);

  useEffect(() => {
    if (aba === "relatorios") buscarRelatorios();
  }, [aba, buscarRelatorios]);

  const [topicId, setTopicId] = useState(TODOS_TOPICOS[0].id);
  const [tipo, setTipo] = useState("mcq");
  const [savedMsg, setSavedMsg] = useState(false);
  const [erro, setErro] = useState("");

  // campos mcq / fillblank
  const [prompt, setPrompt] = useState("");
  const [sentenca, setSentenca] = useState(""); // usada em fillblank (com ____)
  const [opts, setOpts] = useState(["", "", "", ""]);
  const [correctIdx, setCorrectIdx] = useState(0);

  // campos classify
  const [fraseClassify, setFraseClassify] = useState("");
  const [corretosClassify, setCorretosClassify] = useState([]); // índices das palavras certas

  // campos dragdrop
  const [bucketA, setBucketA] = useState("");
  const [bucketB, setBucketB] = useState("");
  const [itensDrag, setItensDrag] = useState([
    { word: "", bucket: "A" },
    { word: "", bucket: "A" },
    { word: "", bucket: "B" },
    { word: "", bucket: "B" },
  ]);

  const topicoAtual = TODOS_TOPICOS.find((t) => t.id === topicId);
  const perguntasDoTopico = custom[topicId] || [];
  const palavrasClassify = fraseClassify.trim() ? fraseClassify.trim().split(/\s+/) : [];

  function atualizarOpt(i, v) {
    setOpts((o) => o.map((x, idx) => (idx === i ? v : x)));
  }

  function toggleCorretoClassify(i) {
    setCorretosClassify((c) => (c.includes(i) ? c.filter((x) => x !== i) : [...c, i]));
  }

  function atualizarItemDrag(i, field, v) {
    setItensDrag((its) => its.map((it, idx) => (idx === i ? { ...it, [field]: v } : it)));
  }

  function addItemDrag() {
    setItensDrag((its) => [...its, { word: "", bucket: "A" }]);
  }

  function removerItemDrag(i) {
    setItensDrag((its) => its.filter((_, idx) => idx !== i));
  }

  function limpar() {
    setPrompt("");
    setSentenca("");
    setOpts(["", "", "", ""]);
    setCorrectIdx(0);
    setFraseClassify("");
    setCorretosClassify([]);
    setBucketA("");
    setBucketB("");
    setItensDrag([
      { word: "", bucket: "A" },
      { word: "", bucket: "A" },
      { word: "", bucket: "B" },
      { word: "", bucket: "B" },
    ]);
    setErro("");
  }

  function salvar() {
    setErro("");
    let novaPergunta = null;

    if (tipo === "mcq") {
      if (!prompt.trim() || opts.some((o) => !o.trim())) {
        setErro("Preencha a pergunta e as 4 alternativas.");
        return;
      }
      novaPergunta = {
        type: "mcq",
        prompt: prompt.trim(),
        options: opts.map((o) => o.trim()),
        correct: opts[correctIdx].trim(),
      };
    } else if (tipo === "fillblank") {
      if (!sentenca.includes("____") || opts.some((o) => !o.trim())) {
        setErro("A frase precisa ter ____ no lugar da lacuna, e as 4 alternativas devem estar preenchidas.");
        return;
      }
      novaPergunta = {
        type: "fillblank",
        prompt: prompt.trim() || "Complete a frase:",
        sentence: sentenca.trim(),
        options: opts.map((o) => o.trim()),
        correct: opts[correctIdx].trim(),
      };
    } else if (tipo === "classify") {
      if (palavrasClassify.length < 2 || corretosClassify.length === 0) {
        setErro("Escreva a frase e marque ao menos uma palavra correta.");
        return;
      }
      novaPergunta = {
        type: "classify",
        prompt: prompt.trim() || "Clique na palavra correta desta frase:",
        words: palavrasClassify,
        correct: corretosClassify.map((i) => palavrasClassify[i]),
      };
    } else if (tipo === "dragdrop") {
      const itensValidos = itensDrag.filter((it) => it.word.trim());
      if (!bucketA.trim() || !bucketB.trim() || itensValidos.length < 2) {
        setErro("Preencha os dois nomes de grupo e ao menos 2 palavras.");
        return;
      }
      novaPergunta = {
        type: "dragdrop",
        prompt: prompt.trim() || "Arraste cada palavra para o grupo correto:",
        buckets: [bucketA.trim(), bucketB.trim()],
        items: itensValidos.map((it) => ({
          word: it.word.trim(),
          bucket: it.bucket === "A" ? bucketA.trim() : bucketB.trim(),
        })),
      };
    }

    if (!novaPergunta) return;

    const next = {
      ...custom,
      [topicId]: [...(custom[topicId] || []), novaPergunta],
    };
    onSave(next);
    limpar();
    setSavedMsg(true);
    setTimeout(() => setSavedMsg(false), 2000);
  }

  function remover(i) {
    const next = {
      ...custom,
      [topicId]: perguntasDoTopico.filter((_, idx) => idx !== i),
    };
    onSave(next);
  }

  return (
    <div className="screen">
      <div className="lesson-header">
        <button className="btn-x" onClick={onExit} aria-label="Sair">
          ×
        </button>
        <h2 className="professor-title">Painel do professor</h2>
      </div>

      <div className="tab-row">
        <button
          className={"tab-btn" + (aba === "perguntas" ? " tab-btn-ativo" : "")}
          onClick={() => setAba("perguntas")}
        >
          Perguntas
        </button>
        <button
          className={"tab-btn" + (aba === "relatorios" ? " tab-btn-ativo" : "")}
          onClick={() => setAba("relatorios")}
        >
          Relatórios dos alunos
        </button>
      </div>

      {aba === "relatorios" && (
        <div className="lesson-body">
          <div className="prof-filtro-row">
            <button className="btn-secundario" onClick={buscarRelatorios} disabled={carregandoRelatorios}>
              {carregandoRelatorios ? "Atualizando…" : "🔄 Atualizar lista"}
            </button>
            <select
              className="prof-select"
              value={filtroTurma}
              onChange={(e) => setFiltroTurma(e.target.value)}
            >
              <option value="todas">Todas as turmas</option>
              {TURMAS.map((t) => (
                <option key={t} value={t}>
                  {t}
                </option>
              ))}
            </select>
          </div>
          {erroRelatorios && <p className="pin-erro">{erroRelatorios}</p>}
          {(() => {
            const relatoriosFiltrados =
              filtroTurma === "todas"
                ? relatorios
                : relatorios.filter((r) => r.turma === filtroTurma);
            if (!carregandoRelatorios && relatoriosFiltrados.length === 0) {
              return (
                <p className="result-sub">
                  {relatorios.length === 0
                    ? "Nenhum relatório recebido ainda."
                    : "Nenhum relatório recebido para essa turma."}
                </p>
              );
            }
            return [...relatoriosFiltrados]
              .reverse()
              .map((r, i) => (
                <div className="relatorio-item" key={i}>
                  <div className="relatorio-item-header">
                    <strong>
                      {r.nome}
                      {r.turma ? ` · ${r.turma}` : ""}
                    </strong>
                    <span>{new Date(r.data).toLocaleString("pt-BR")}</span>
                  </div>
                  <pre className="relatorio-texto">{r.texto}</pre>
                </div>
              ));
          })()}
        </div>
      )}

      {aba === "perguntas" && (
      <div className="lesson-body">
        <label className="prof-label">Tópico</label>
        <select className="prof-select" value={topicId} onChange={(e) => setTopicId(e.target.value)}>
          {TODOS_TOPICOS.map((t) => (
            <option key={t.id} value={t.id}>
              {t.nome}
            </option>
          ))}
        </select>

        <label className="prof-label">Tipo de exercício</label>
        <div className="tipo-grid">
          {Object.entries(TIPO_LABELS).map(([key, label]) => (
            <button
              key={key}
              className={"tipo-opt" + (tipo === key ? " tipo-opt-ativo" : "")}
              onClick={() => {
                setTipo(key);
                setErro("");
              }}
            >
              {label}
            </button>
          ))}
        </div>

        {(tipo === "mcq" || tipo === "classify" || tipo === "dragdrop") && (
          <>
            <label className="prof-label">
              Enunciado {tipo !== "mcq" && "(opcional — um padrão será usado se deixar em branco)"}
            </label>
            <input
              className="prof-input"
              value={prompt}
              onChange={(e) => setPrompt(e.target.value)}
              placeholder="Ex: Qual destas palavras é um substantivo?"
            />
          </>
        )}

        {tipo === "mcq" && (
          <>
            <label className="prof-label">Alternativas (marque a correta)</label>
            {opts.map((o, i) => (
              <div className="prof-opt-row" key={i}>
                <input type="radio" name="correta-mcq" checked={correctIdx === i} onChange={() => setCorrectIdx(i)} />
                <input
                  className="prof-input"
                  value={o}
                  onChange={(e) => atualizarOpt(i, e.target.value)}
                  placeholder={`Alternativa ${i + 1}`}
                />
              </div>
            ))}
          </>
        )}

        {tipo === "fillblank" && (
          <>
            <label className="prof-label">Frase (use ____ no lugar da lacuna)</label>
            <input
              className="prof-input"
              value={sentenca}
              onChange={(e) => setSentenca(e.target.value)}
              placeholder="Ex: O ____ dormiu o dia todo."
            />
            <label className="prof-label">Alternativas (marque a correta)</label>
            {opts.map((o, i) => (
              <div className="prof-opt-row" key={i}>
                <input type="radio" name="correta-fill" checked={correctIdx === i} onChange={() => setCorrectIdx(i)} />
                <input
                  className="prof-input"
                  value={o}
                  onChange={(e) => atualizarOpt(i, e.target.value)}
                  placeholder={`Alternativa ${i + 1}`}
                />
              </div>
            ))}
          </>
        )}

        {tipo === "classify" && (
          <>
            <label className="prof-label">Frase completa (separe as palavras com espaço)</label>
            <input
              className="prof-input"
              value={fraseClassify}
              onChange={(e) => {
                setFraseClassify(e.target.value);
                setCorretosClassify([]);
              }}
              placeholder="Ex: O cachorro correu depressa"
            />
            {palavrasClassify.length > 0 && (
              <>
                <label className="prof-label">Toque nas palavras que são a resposta certa</label>
                <div className="classify-preview">
                  {palavrasClassify.map((w, i) => (
                    <button
                      key={i}
                      className={"word-chip-select" + (corretosClassify.includes(i) ? " word-chip-selected" : "")}
                      onClick={() => toggleCorretoClassify(i)}
                    >
                      {w}
                    </button>
                  ))}
                </div>
              </>
            )}
          </>
        )}

        {tipo === "dragdrop" && (
          <>
            <label className="prof-label">Nome dos dois grupos</label>
            <div className="prof-opt-row">
              <input
                className="prof-input"
                value={bucketA}
                onChange={(e) => setBucketA(e.target.value)}
                placeholder="Grupo A (ex: Substantivo)"
              />
              <input
                className="prof-input"
                value={bucketB}
                onChange={(e) => setBucketB(e.target.value)}
                placeholder="Grupo B (ex: Não é substantivo)"
              />
            </div>
            <label className="prof-label">Palavras e o grupo de cada uma</label>
            {itensDrag.map((it, i) => (
              <div className="prof-opt-row" key={i}>
                <input
                  className="prof-input"
                  value={it.word}
                  onChange={(e) => atualizarItemDrag(i, "word", e.target.value)}
                  placeholder={`Palavra ${i + 1}`}
                />
                <select
                  className="prof-select prof-select-inline"
                  value={it.bucket}
                  onChange={(e) => atualizarItemDrag(i, "bucket", e.target.value)}
                >
                  <option value="A">{bucketA || "Grupo A"}</option>
                  <option value="B">{bucketB || "Grupo B"}</option>
                </select>
                <button className="btn-remover" onClick={() => removerItemDrag(i)}>
                  remover
                </button>
              </div>
            ))}
            <button className="btn-secundario" onClick={addItemDrag}>
              + adicionar palavra
            </button>
          </>
        )}

        {erro && <p className="pin-erro">{erro}</p>}

        <button className="btn-primary" onClick={salvar}>
          Salvar pergunta
        </button>
        {savedMsg && <p className="prof-saved">Pergunta adicionada para todos os jogadores.</p>}

        {perguntasDoTopico.length > 0 && (
          <div className="prof-list">
            <div className="prof-list-title">
              Perguntas adicionadas em {topicoAtual.nome} ({perguntasDoTopico.length})
            </div>
            {perguntasDoTopico.map((p, i) => (
              <div className="prof-list-item" key={i}>
                <span>
                  <span className="prof-list-tipo">{TIPO_LABELS[p.type]}</span> {p.prompt}
                </span>
                <button className="btn-remover" onClick={() => remover(i)}>
                  remover
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
      )}
    </div>
  );
}

/* =========================================================================
   APP
   ========================================================================= */

function App() {
  const { progress, save, loaded, trocarAluno, identificarAluno } = useProgress();
  const { custom, save: saveCustom, loaded: customLoaded } = useCustomQuestions();
  // trilha | teoria | licao | resultado | colecao | relatorio | professorLogin | professorPanel
  const [view, setView] = useState("trilha");
  const [selectedTopicId, setSelectedTopicId] = useState(null);
  const [lastResult, setLastResult] = useState(null);
  const streakChecked = useRef(false);
  const prevUnlockedRef = useRef(null);
  const [filaConquistas, setFilaConquistas] = useState([]);

  useEffect(() => {
    if (!loaded || !progress || streakChecked.current) return;
    streakChecked.current = true;
    const hoje = new Date().toDateString();
    if (progress.ultimoDia === hoje) return;
    let dias = 1;
    if (progress.ultimoDia) {
      const ontem = new Date();
      ontem.setDate(ontem.getDate() - 1);
      if (progress.ultimoDia === ontem.toDateString()) {
        dias = progress.diasConsecutivos + 1;
      }
    }
    save({ ...progress, diasConsecutivos: dias, ultimoDia: hoje });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, progress]);

  // Detecta conquistas novas comparando com a última checagem, para animar só o que acabou de ser desbloqueado
  useEffect(() => {
    if (!loaded || !progress || !progress.turma) return;
    const achievements = achievementsParaTurma(progress.turma);
    const desbloqueadasAgora = new Set(achievements.filter((a) => a.condicao(progress)).map((a) => a.id));
    if (prevUnlockedRef.current === null) {
      prevUnlockedRef.current = desbloqueadasAgora;
      return;
    }
    const novas = achievements.filter(
      (a) => desbloqueadasAgora.has(a.id) && !prevUnlockedRef.current.has(a.id)
    );
    prevUnlockedRef.current = desbloqueadasAgora;
    if (novas.length > 0) {
      setFilaConquistas((fila) => [...fila, ...novas]);
    }
  }, [progress, loaded]);

  // Consome a fila de conquistas, exibindo uma por vez
  useEffect(() => {
    if (filaConquistas.length === 0) return;
    const t = setTimeout(() => {
      setFilaConquistas((fila) => fila.slice(1));
    }, 2700);
    return () => clearTimeout(t);
  }, [filaConquistas]);

  if (!loaded || !progress || !customLoaded) {
    return (
      <div className="app-shell">
        <style>{CSS}</style>
        <div className="blob blob-a" />
        <div className="blob blob-b" />
        <div className="blob blob-c" />
        <div className="screen center-screen">
          <p className="loading-text">Carregando…</p>
        </div>
      </div>
    );
  }

  if (!progress.nome || !progress.turma) {
    return (
      <div className="app-shell">
        <style>{CSS}</style>
        <div className="blob blob-a" />
        <div className="blob blob-b" />
        <div className="blob blob-c" />
        <NomeScreen
          onSubmit={(nome, turma) => identificarAluno(nome, turma)}
          nomeInicial={progress.nome}
          turmaInicial={progress.turma}
        />
      </div>
    );
  }

  const baseTopic = selectedTopicId ? TODOS_TOPICOS.find((t) => t.id === selectedTopicId) : null;
  const activeTopic = baseTopic
    ? { ...baseTopic, exercicios: [...baseTopic.exercicios, ...(custom[baseTopic.id] || [])] }
    : null;

  function openTopic(topic) {
    setSelectedTopicId(topic.id);
    setView("teoria");
  }

  function comecarTeoria() {
    if (!progress.teoriaVistos.includes(baseTopic.id)) {
      save({ ...progress, teoriaVistos: [...progress.teoriaVistos, baseTopic.id] });
    }
    setView("licao");
  }

  function onEachAnswer(tipoExercicio, correto) {
    const sequenciaAtual = correto ? progress.sequenciaAtual + 1 : 0;
    save({
      ...progress,
      totalExerciciosRespondidos: progress.totalExerciciosRespondidos + 1,
      tiposUsados: correto ? { ...progress.tiposUsados, [tipoExercicio]: true } : progress.tiposUsados,
      sequenciaAtual,
      maiorSequencia: Math.max(progress.maiorSequencia, sequenciaAtual),
    });
  }

  function onFail() {
    save({ ...progress, falhasTotais: progress.falhasTotais + 1 });
  }

  function finishTopic(acertos, total) {
    const xpGanho = acertos * 10;
    const already = progress.concluidos.includes(baseTopic.id);
    const prevStats = {
      tentativas: 0,
      acertos: 0,
      erros: 0,
      completoSemErro: false,
      primeiraTentativaAcertos: null,
      primeiraTentativaErros: null,
      ...(progress.estatisticasPorTopico[baseTopic.id] || {}),
    };
    const erros = total - acertos;
    const ehPrimeiraTentativa = prevStats.tentativas === 0;
    const novaStats = {
      tentativas: prevStats.tentativas + 1,
      acertos: prevStats.acertos + acertos,
      erros: prevStats.erros + erros,
      completoSemErro: prevStats.completoSemErro || erros === 0,
      // Guardado só na primeira tentativa e nunca mais sobrescrito — é o retrato
      // mais fiel da dificuldade real do aluno, sem diluição por repetições.
      primeiraTentativaAcertos: ehPrimeiraTentativa ? acertos : prevStats.primeiraTentativaAcertos,
      primeiraTentativaErros: ehPrimeiraTentativa ? erros : prevStats.primeiraTentativaErros,
    };
    const next = {
      ...progress,
      xp: progress.xp + xpGanho,
      concluidos: already ? progress.concluidos : [...progress.concluidos, baseTopic.id],
      estatisticasPorTopico: { ...progress.estatisticasPorTopico, [baseTopic.id]: novaStats },
    };
    save(next);
    setLastResult({ acertos, total, xpGanho });
    setView("resultado");
  }

  return (
    <div className="app-shell">
      <style>{CSS}</style>
      <div className="blob blob-a" />
      <div className="blob blob-b" />
      <div className="blob blob-c" />
      {view === "trilha" && (
        <Trilha
          progress={progress}
          onOpenTopic={openTopic}
          onOpenProfessor={() => setView("professorLogin")}
          onOpenColecao={() => setView("colecao")}
          onOpenRelatorio={() => setView("relatorio")}
          onTrocarAluno={trocarAluno}
        />
      )}
      {view === "teoria" && baseTopic && (
        <TeoriaScreen topic={baseTopic} onStart={comecarTeoria} onExit={() => setView("trilha")} />
      )}
      {view === "licao" && activeTopic && (
        <LicaoScreen
          topic={activeTopic}
          onFinish={finishTopic}
          onExit={() => setView("trilha")}
          onEachAnswer={onEachAnswer}
          onFail={onFail}
        />
      )}
      {view === "resultado" && lastResult && (
        <ResultScreen
          acertos={lastResult.acertos}
          total={lastResult.total}
          xpGanho={lastResult.xpGanho}
          onContinue={() => setView("trilha")}
        />
      )}
      {view === "colecao" && <ColecaoScreen progress={progress} onExit={() => setView("trilha")} />}
      {view === "relatorio" && <RelatorioScreen progress={progress} onExit={() => setView("trilha")} />}
      {view === "professorLogin" && (
        <ProfessorLogin
          onSuccess={() => setView("professorPanel")}
          onExit={() => setView("trilha")}
        />
      )}
      {view === "professorPanel" && (
        <ProfessorPanel custom={custom} onSave={saveCustom} onExit={() => setView("trilha")} />
      )}
      {filaConquistas.length > 0 && <ConquistaToast key={filaConquistas[0].id} conquista={filaConquistas[0]} />}
    </div>
  );
}

function ConquistaToast({ conquista }) {
  return (
    <div className="conquista-toast">
      <div className="conquista-toast-icone" style={{ background: conquista.cor }}>
        {conquista.icone}
      </div>
      <div className="conquista-toast-texto">
        <div className="conquista-toast-titulo">Selo desbloqueado</div>
        <div className="conquista-toast-nome">{conquista.nome}</div>
      </div>
    </div>
  );
}

.drag-instructions { font-size: 12.5px; color: rgba(129,48,23,0.65); margin: -12px 0 14px; }
.drag-chip {
  border: 1px solid rgba(255,255,255,0.65);
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(8px);
  color: var(--brown);
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 14.5px;
  line-height: 1.4;
  max-width: 100%;
  cursor: grab;
  user-select: none;
}
.drag-chip.placed { cursor: default; padding: 5px 10px; font-size: 13px; }
.chip-selected { outline: 2px solid var(--pink); background: rgba(255,43,111,0.18); }
.chip-dragging-source { opacity: 0.25; }
.drag-ghost {
  position: fixed;
  z-index: 50;
  pointer-events: none;
  border: 1px solid rgba(255,255,255,0.8);
  background: rgba(255,43,111,0.85);
  color: #fff;
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 14.5px;
  box-shadow: 0 10px 22px rgba(129,48,23,0.3);
  transform: scale(1.05) rotate(-2deg);
}
.bucket-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bucket {
  border: 1.5px dashed rgba(129,48,23,0.3);
  border-radius: 16px;
  padding: 10px;
  min-height: 90px;
  background: rgba(255,255,255,0.20);
}
.bucket-hover { border-color: var(--pink); background: rgba(255,255,255,0.40); }
.bucket-selectable { cursor: pointer; }
.bucket-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: rgba(129,48,23,0.65);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.bucket-items { display: flex; flex-wrap: wrap; gap: 6px; }

.btn-check, .btn-primary {
  margin-top: 16px;
  width: 100%;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.6);
  background: var(--pink);
  color: #fff;
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 15.5px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(255,43,111,0.35);
}
.btn-check:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
.btn-primary:active { transform: translateY(1px); }

.feedback-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  justify-content: center;
  z-index: 2;
}
.feedback-bar {
  padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(22px) saturate(160%);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  border-top: 1px solid rgba(255,255,255,0.6);
}
.fb-correct .btn-primary { background: #4FA88F; box-shadow: 0 8px 20px rgba(79,168,143,0.35); }
.fb-wrong .btn-primary { background: var(--pink); }
.fb-text { max-width: 440px; margin: 0 auto 10px; font-weight: 700; font-family: 'Fraunces', serif; color: var(--brown); }
.feedback-bar .btn-primary { max-width: 440px; margin: 0 auto; display: block; }

/* ---------- Fim de lição / resultado ---------- */

.fail-card, .result-card {
  position: relative;
  z-index: 1;
  text-align: center;
  background: rgba(255,255,255,0.32);
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.55);
  border-radius: 26px;
  padding: 32px 26px;
  max-width: 340px;
  box-shadow: 0 12px 34px rgba(129,48,23,0.18);
}
.fail-emoji {
  width: 56px; height: 56px; line-height: 56px;
  border-radius: 50%;
  background: var(--pink); color: #fff;
  font-size: 26px; margin: 0 auto 14px;
  box-shadow: 0 8px 20px rgba(255,43,111,0.4);
}
.result-stamp {
  width: 60px; height: 60px; line-height: 60px;
  border-radius: 50%;
  background: rgba(79,168,143,0.85); color: #fff;
  font-size: 28px; margin: 0 auto 14px;
  transform: rotate(-8deg);
  box-shadow: 0 8px 20px rgba(79,168,143,0.4);
}
.fail-card h2, .result-card h2 { font-family: 'Fraunces', serif; margin: 0 0 6px; color: var(--brown); }
.result-sub { color: rgba(129,48,23,0.7); margin: 0 0 10px; }
.result-xp {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  color: #2E6B57;
  font-weight: 700;
  margin-bottom: 18px;
}
.dica-box {
  background: rgba(255,255,255,0.35);
  border-left: 3px solid var(--pink);
  border-radius: 0 12px 12px 0;
  padding: 10px 12px;
  font-size: 13.5px;
  text-align: left;
  margin: 12px 0 20px;
  color: var(--brown);
}

.header-actions { display: flex; align-items: center; gap: 8px; }
.btn-professor {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(8px);
  font-size: 16px;
  cursor: pointer;
}

.teoria-card {
  padding: 22px;
  border-radius: 26px;
  background: rgba(255,255,255,0.28);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.5);
  box-shadow: 0 8px 28px rgba(129,48,23,0.10);
}
.teoria-card h2 {
  font-family: 'Fraunces', serif;
  margin: 0 0 12px;
  color: var(--brown);
  font-size: 20px;
}
.teoria-dica {
  font-weight: 700;
  margin: 0 0 12px;
  color: var(--brown);
}
.teoria-texto {
  line-height: 1.6;
  color: rgba(129,48,23,0.85);
  margin: 0 0 20px;
  font-size: 14.5px;
}

.pin-input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid rgba(129,48,23,0.3);
  background: rgba(255,255,255,0.5);
  font-size: 16px;
  text-align: center;
  letter-spacing: 4px;
  margin: 14px 0 6px;
}
.pin-erro { color: var(--pink); font-size: 13px; margin: 0 0 10px; }
.btn-secundario {
  margin-top: 10px;
  width: 100%;
  padding: 12px;
  border-radius: 14px;
  border: 1px solid rgba(129,48,23,0.25);
  background: transparent;
  color: var(--brown);
  font-size: 14px;
  cursor: pointer;
}

.professor-title { font-family: 'Fraunces', serif; font-size: 18px; margin: 0; color: var(--brown); }
.prof-label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: rgba(129,48,23,0.7);
  margin: 16px 0 6px;
}
.prof-select, .prof-input {
  width: 100%;
  padding: 11px 12px;
  border-radius: 10px;
  border: 1px solid rgba(129,48,23,0.25);
  background: rgba(255,255,255,0.55);
  font-size: 14.5px;
  color: var(--brown);
  font-family: 'Source Sans 3', sans-serif;
}
.prof-opt-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.prof-opt-row .prof-input { flex: 1; }
.prof-saved { color: #2E6B57; font-size: 13px; margin-top: 10px; text-align: center; }
.prof-list { margin-top: 22px; border-top: 1px dashed rgba(129,48,23,0.25); padding-top: 14px; }
.prof-list-title { font-size: 12.5px; color: rgba(129,48,23,0.65); margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }
.prof-list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(129,48,23,0.12);
  font-size: 13.5px;
}
.btn-remover {
  border: none;
  background: none;
  color: var(--pink);
  font-size: 12px;
  cursor: pointer;
  text-decoration: underline;
  white-space: nowrap;
}

.tipo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tipo-opt {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid rgba(129,48,23,0.25);
  background: rgba(255,255,255,0.4);
  color: var(--brown);
  font-size: 13px;
  cursor: pointer;
}
.tipo-opt-ativo { background: var(--pink); color: #fff; border-color: var(--pink); font-weight: 700; }

.classify-preview {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  background: rgba(255,255,255,0.35);
  border-radius: 12px;
  padding: 12px;
}
.word-chip-select {
  border: 1px solid rgba(129,48,23,0.25);
  background: rgba(255,255,255,0.5);
  color: var(--brown);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 14px;
  cursor: pointer;
}
.word-chip-selected { background: #4FA88F; color: #fff; border-color: #4FA88F; }

.prof-select-inline { max-width: 55%; }
.prof-list-tipo {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: rgba(129,48,23,0.6);
  display: block;
}

.acoes-secundarias { display: flex; gap: 8px; margin-bottom: 18px; }
.chip-acao {
  flex: 1;
  padding: 10px 12px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.28);
  backdrop-filter: blur(12px);
  color: var(--brown);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.chip-acao-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: rgba(129,48,23,0.6);
}

.colecao-contagem {
  position: relative;
  z-index: 1;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  color: rgba(129,48,23,0.7);
  margin: 0 0 16px;
}
.colecao-grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.conquista-card {
  background: rgba(255,255,255,0.30);
  backdrop-filter: blur(12px);
  border: 2px solid rgba(255,255,255,0.5);
  border-radius: 16px;
  padding: 12px 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.conquista-bloqueada { opacity: 0.55; }
.conquista-icone {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.conquista-nome { font-size: 10.5px; font-weight: 600; color: var(--brown); line-height: 1.25; }

.relatorio-texto {
  white-space: pre-wrap;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--brown);
  background: rgba(255,255,255,0.35);
  border-radius: 14px;
  padding: 14px;
  margin: 0 0 16px;
}

.tab-row {
  position: relative;
  z-index: 1;
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.tab-btn {
  flex: 1;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid rgba(129,48,23,0.25);
  background: rgba(255,255,255,0.35);
  color: var(--brown);
  font-size: 13px;
  cursor: pointer;
}
.tab-btn-ativo { background: var(--pink); color: #fff; border-color: var(--pink); font-weight: 700; }

.prof-filtro-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 14px;
}
.prof-filtro-row .prof-select { width: auto; min-width: 160px; margin: 0; }

.relatorio-item {
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px dashed rgba(129,48,23,0.2);
}
.relatorio-item-header {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  color: rgba(129,48,23,0.7);
  margin-bottom: 6px;
}

.conquista-toast {
  position: fixed;
  left: 50%;
  top: 26px;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,0.88);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.75);
  border-radius: 20px;
  padding: 12px 18px;
  box-shadow: 0 14px 32px rgba(129,48,23,0.30);
  max-width: 88%;
  pointer-events: none;
  animation: conquistaCiclo 2.7s ease forwards;
}
@keyframes conquistaCiclo {
  0% { transform: translateX(-50%) scale(0.4) translateY(-16px); opacity: 0; }
  14% { transform: translateX(-50%) scale(1.06) translateY(2px); opacity: 1; }
  22% { transform: translateX(-50%) scale(1) translateY(0); opacity: 1; }
  86% { transform: translateX(-50%) scale(1) translateY(0); opacity: 1; }
  100% { transform: translateX(-50%) scale(0.92) translateY(-10px); opacity: 0; }
}
.conquista-toast-icone {
  width: 46px;
  height: 46px;
  min-width: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: #fff;
  box-shadow: 0 6px 16px rgba(129,48,23,0.3);
  animation: conquistaGiro 0.7s ease;
}
@keyframes conquistaGiro {
  0% { transform: rotate(-25deg) scale(0.5); }
  55% { transform: rotate(10deg) scale(1.2); }
  100% { transform: rotate(0deg) scale(1); }
}
.conquista-toast-texto { text-align: left; }
.conquista-toast-titulo {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: rgba(129,48,23,0.6);
}
.conquista-toast-nome {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--brown);
}

.conquista-card { animation: conquistaCardEntra 0.35s ease; }
@keyframes conquistaCardEntra {
  0% { transform: scale(0.9); opacity: 0.6; }
  100% { transform: scale(1); opacity: 1; }
}

@media (max-width: 380px) {
  .ex-prompt { font-size: 18px; }
}
`;


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
